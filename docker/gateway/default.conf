# Pasarela local: sirve la app web y enruta Auth, API REST, Realtime y el Telar bajo el mismo origen
# (sin CORS abierto). Equivale a lo que hace el API gateway de Supabase en la nube.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:8000 wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /config.json {
    alias /tmp/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Realtime resuelve el inquilino por el primer segmento del host.
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_read_timeout 3600s;
  }

  location /telar/ {
    proxy_pass http://telar:8787/;
    proxy_read_timeout 60s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
