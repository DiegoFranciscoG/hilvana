# Configuración local de Supabase para Hilvana (CLI 3.1.0, ver docs/verificacion.md).
# Solo se encienden los servicios que usa el proyecto: base, Auth, API REST y Realtime.
project_id = "hilvana"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Los datos de demo se crean con `deno task demo:seed`, que da de alta usuarios por la API de Auth.
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits" # regla de complejidad, no un secreto: gitleaks:allow

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
